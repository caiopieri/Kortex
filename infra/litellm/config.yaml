# =============================================================================
# LiteLLM Proxy — Gateway de Fallback da Meta-fábrica
# 3 modelos virtuais (arquiteto / operario / revisor), cada um com fila de
# fallback free-primeiro. O cliente (OpenCode) só chama "arquiteto" / "operario"
# / "revisor"; o proxy escolhe o modelo real e troca sozinho em 429/erro.
#
# ORDEM baseada em benchmarks 2026 (Artificial Analysis / SWE-Bench Pro /
# LiveCodeBench — pesquisado 2026-07-07), com 3 princípios:
#   1. Cada papel começa no melhor modelo PARA AQUELE TRABALHO.
#   2. TOPOS ESCALONADOS entre papéis (GLM/DeepSeek/MiniMax) → um 429 não
#      derruba os 3 terminais ao mesmo tempo (mesma API key da NVIDIA).
#   3. Revisor ≠ topo do Operário (erro correlacionado não se pega).
# ⚠️ Isto é um PONTO DE PARTIDA. A ordem real deve ser corrigida por MEDIÇÃO
#    (o livro-razão/curador do motor mede qualidade+custo por modelo nas SUAS
#    tarefas → ranqueia por dado, não por benchmark alheio). "Melhor é dado."
#
# ⚠️ VERIFICAR IDs exatos em https://integrate.api.nvidia.com/v1/models antes
#    de fechar (regra do projeto: nunca ID de memória). Rodar o smoke test.
#
# Contexto na troca: cada request carrega a conversa inteira (o cliente
# reenvia tudo). No 429, o LiteLLM repassa a MESMA request ao próximo modelo
# → o novo continua com todo o contexto, automático. Nada de "continuar".
# =============================================================================

model_list:
  # ---------------------------------------------------------------------------
  # OPERÁRIO — codificação real (SWE multi-arquivo). Topo: GLM-5.2 (líder
  # open-weight geral em engenharia agêntica, Artificial Analysis 51.1).
  # ---------------------------------------------------------------------------
  - model_name: operario           # GLM-5.2 — líder open-weight de coding agêntico
    litellm_params: {model: nvidia_nim/z-ai/glm-5.2, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: operario_fb1       # DeepSeek-V4-Pro — LiveCodeBench + 1M ctx
    litellm_params: {model: nvidia_nim/deepseek-ai/deepseek-v4-pro, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: operario_fb2       # Kimi-K2.6 — forte em tool use / agente
    litellm_params: {model: nvidia_nim/moonshotai/kimi-k2.6, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: operario_fb3       # Qwen3-Coder-480B — melhor eficiência/parâmetro
    litellm_params: {model: nvidia_nim/qwen/qwen3-coder-480b-a35b-instruct, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: operario_fb4       # MiniMax-M3 — líder SWE-Bench Pro (mas é o topo do revisor; entra fundo aqui)
    litellm_params: {model: nvidia_nim/minimaxai/minimax-m3, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY, max_tokens: 4096}
  - model_name: operario_fb5       # Qwen3.5-397B — generalista grande
    litellm_params: {model: nvidia_nim/qwen/qwen3.5-397b-a17b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: operario_fb6       # DeepSeek-V4-Flash — rápido, mantém o fluxo vivo
    litellm_params: {model: nvidia_nim/deepseek-ai/deepseek-v4-flash, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: operario_fb7       # Qwen2.5-Coder-32B — pequeno, quase sempre disponível
    litellm_params: {model: nvidia_nim/qwen/qwen2.5-coder-32b-instruct, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: operario_fb8       # Gemini-2.5-Flash — fora da NVIDIA (bucket de limite diferente)
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY}

  # ---------------------------------------------------------------------------
  # ARQUITETO — julgamento/arquitetura. Topo: DeepSeek-V4-Pro (reasoning forte)
  # — escalonado de propósito p/ NÃO colidir com o topo do operário (GLM).
  # ---------------------------------------------------------------------------
  - model_name: arquiteto          # DeepSeek-V4-Pro — reasoning + código
    litellm_params: {model: nvidia_nim/deepseek-ai/deepseek-v4-pro, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: arquiteto_fb1      # GLM-5.2 — líder geral (segunda opção forte)
    litellm_params: {model: nvidia_nim/z-ai/glm-5.2, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: arquiteto_fb2      # Qwen3.5-397B
    litellm_params: {model: nvidia_nim/qwen/qwen3.5-397b-a17b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: arquiteto_fb3      # Kimi-K2.6
    litellm_params: {model: nvidia_nim/moonshotai/kimi-k2.6, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: arquiteto_fb4      # Nemotron-3-Super-120B
    litellm_params: {model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: arquiteto_fb5      # MiniMax-M3
    litellm_params: {model: nvidia_nim/minimaxai/minimax-m3, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY, max_tokens: 4096}
  - model_name: arquiteto_fb6      # Gemini-2.5-Flash
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY}

  # ---------------------------------------------------------------------------
  # REVISOR — adversarial. Topo: Gemini-2.5-Flash (provedor Google) — DESEQUES-
  # TRA o revisor do topo do operário/arquiteto (ambos NVIDIA NIM): um 429 na
  # NVIDIA não derruba o revisor junto. Família diferente → crítica independente.
  # ---------------------------------------------------------------------------
  - model_name: revisor            # Gemini-2.5-Flash — topo em provedor distinto (Google)
    litellm_params: {model: gemini/gemini-2.5-flash, api_key: os.environ/GEMINI_API_KEY}
  - model_name: revisor_fb1        # MiniMax-M3 — líder SWE-Bench Pro (volta à NVIDIA como 1º fallback)
    litellm_params: {model: nvidia_nim/minimaxai/minimax-m3, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY, max_tokens: 4096}
  - model_name: revisor_fb2        # Qwen3.5-397B
    litellm_params: {model: nvidia_nim/qwen/qwen3.5-397b-a17b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: revisor_fb3        # DeepSeek-V4-Pro
    litellm_params: {model: nvidia_nim/deepseek-ai/deepseek-v4-pro, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: revisor_fb4        # Kimi-K2.6
    litellm_params: {model: nvidia_nim/moonshotai/kimi-k2.6, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: revisor_fb5        # Mistral-Large-3-675B
    litellm_params: {model: nvidia_nim/mistralai/mistral-large-3-675b-instruct-2512, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}
  - model_name: revisor_fb6        # Nemotron-3-Super-120B
    litellm_params: {model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_NIM_API_KEY}

# =============================================================================
# ROTEAMENTO — fallback ordenado + cooldown (o coração da robustez)
# =============================================================================
router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - operario:  [operario_fb1, operario_fb2, operario_fb3, operario_fb4, operario_fb5, operario_fb6, operario_fb7, operario_fb8]
    - operario_fb1: [operario_fb2, operario_fb3, operario_fb4, operario_fb5, operario_fb6, operario_fb7]
    - operario_fb2: [operario_fb3, operario_fb4, operario_fb5, operario_fb6, operario_fb7]
    - operario_fb3: [operario_fb4, operario_fb5, operario_fb6, operario_fb7]
    - operario_fb4: [operario_fb5, operario_fb6, operario_fb7]
    - operario_fb5: [operario_fb6, operario_fb7]
    - operario_fb6: [operario_fb7]
    - arquiteto: [arquiteto_fb1, arquiteto_fb2, arquiteto_fb3, arquiteto_fb4, arquiteto_fb5, arquiteto_fb6]
    - arquiteto_fb1: [arquiteto_fb2, arquiteto_fb3, arquiteto_fb4, arquiteto_fb5]
    - arquiteto_fb2: [arquiteto_fb3, arquiteto_fb4, arquiteto_fb5]
    - arquiteto_fb3: [arquiteto_fb4, arquiteto_fb5]
    - arquiteto_fb4: [arquiteto_fb5]
    - revisor:   [revisor_fb1, revisor_fb2, revisor_fb3, revisor_fb4, revisor_fb5, revisor_fb6]
    - revisor_fb1: [revisor_fb2, revisor_fb3, revisor_fb4, revisor_fb5]
    - revisor_fb2: [revisor_fb3, revisor_fb4, revisor_fb5]
    - revisor_fb3: [revisor_fb4, revisor_fb5]
    - revisor_fb4: [revisor_fb5]
  allowed_fails: 1          # 1 falha já bane temporariamente (troca rápida)
  cooldown_time: 60         # segundos no banco antes de voltar a ser tentado
  num_retries: 2            # tentativas no mesmo modelo antes de cair pro fallback
  timeout: 600              # tarefas de código são longas

litellm_settings:
  drop_params: true         # ignora params que um provider não suporta (evita quebra boba)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # a chave que o OpenCode usa pra falar com o proxy

# =============================================================================
# PROVIDERS EXTRAS (opcional — mais profundidade free; descomentar quando quiser)
#   Alibaba (Qwen 1M tokens/modelo) e OpenRouter free ampliam ainda mais o fôlego.
# =============================================================================
