[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-metafabrica"
version = "0.5.0"
description = "Motor v0.5 da Meta-fábrica — grafo LangGraph fixo que interpreta uma WorkflowSpec dinâmica"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0,<2",
    "pydantic>=2.7,<3",
    # Checkpointer durável (resume pós-crash, T3). NB: o pin original do HANDOFF
    # era "<3", mas sqlite-saver 2.x exige langgraph-checkpoint<3, que conflita
    # com langgraph 1.x (exige checkpoint>=4.1). Só a linha 3.x do sqlite-saver
    # é compatível com langgraph 1.x — daí ">=3,<4".
    "langgraph-checkpoint-sqlite>=3,<4",
    "mcp>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11,<1", "mypy>=1.15,<2", "bandit>=1.8,<2"]
studio = [
    "langgraph-cli[inmem]>=0.4.29,<0.5",
    "langgraph-api==0.10.0",
    "langgraph-runtime-inmem==0.30.0",
]

[tool.setuptools.packages.find]
include = ["motor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
