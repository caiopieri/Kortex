[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-metafabrica"
version = "0.5.0"
description = "Motor v0.5 da Meta-fábrica — grafo LangGraph fixo que interpreta uma WorkflowSpec dinâmica"
# Teto em 3.14: nessa versão o `langchain_core` (via langgraph) ainda importa
# `pydantic.v1`, que avisa não ser compatível. A suíte passa, mas o aviso é um
# sinal de incompatibilidade real — não rode o gate lá até a cadeia atualizar.
requires-python = ">=3.10,<3.14"
dependencies = [
    "langgraph>=1.0,<2",
    "pydantic>=2.7,<3",
    # Portao, nao conveniencia: o validador `schema_json` reprova fechado sem
    # ela (grafo.py::_validar_schema_json). Ficou anos como import opcional com
    # fallback silencioso mais fraco -- achado A-06 da auditoria Anthropic.
    "jsonschema>=4,<5",
    # `typing.assert_never` só existe no Python 3.11; o motor ainda suporta 3.10.
    "typing-extensions>=4.1,<5",
    # Checkpointer durável (resume pós-crash, T3). sqlite-saver 2.x exige
    # langgraph-checkpoint<3, que conflita
    # com langgraph 1.x (exige checkpoint>=4.1). Só a linha 3.x do sqlite-saver
    # é compatível com langgraph 1.x — daí ">=3,<4".
    "langgraph-checkpoint-sqlite>=3,<4",
    "mcp>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "bandit>=1.8,<2",
]
studio = [
    "langgraph-cli[inmem]>=0.4.29,<0.5",
    "langgraph-api==0.10.0",
    "langgraph-runtime-inmem==0.30.0",
]

[tool.setuptools.packages.find]
include = ["motor*"]

[tool.setuptools.package-data]
motor_painel = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Rede de segurança: um teste travado não pode travar o gate inteiro. O gate
# alvo é <5 min determinístico; 120s por teste é folgado para a suíte atual
# (o teste mais lento fica bem abaixo disso) e ainda corta um deadlock rápido.
timeout = 120

[tool.ruff]
target-version = "py310"

# Conjunto de regras EXPLÍCITO — não herde o default da ferramenta.
# O default do ruff mudou na 0.16.0: com `ruff>=0.11,<1` no dev dep, a mesma
# árvore passava na 0.15.21 e acusava 351 achados na 0.16.0. Gate cujo
# resultado depende de qual versão o CI resolveu não é gate. Estes são os
# defaults clássicos (pyflakes + os subconjuntos de pycodestyle), ou seja, o
# que este projeto sempre checou — só que agora dito em voz alta.
#
# Subir a régua (I, UP, B, BLE...) é decisão de produto, não efeito colateral
# de um upgrade: a 0.16.0 aponta 103 FURB157, 93 UP045, 57 I001 e 31 BLE001.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
