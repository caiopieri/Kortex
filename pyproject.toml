[project]
name = "motor-metafabrica"
version = "0.5.0"
description = "Motor v0.5 da Meta-fábrica — grafo LangGraph fixo que interpreta uma WorkflowSpec dinâmica"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
