<!DOCTYPE html>
<!-- Mock aprovado do Claude Design (projeto "Interface da Meta-fábrica" v2, P2: Grafo 3D real).
     Fonte: claude.ai/design/p/78ed73c5-95fb-42cd-b3fc-554955e4512e?file=Grafo3D.dc.html
     Importado em 2026-07-03. Dados aqui são FICTÍCIOS (maquete) — a implementação real liga ao /dados do painel. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<style>
  body{margin:0;background:#060708;overflow:hidden}
  .mf-root{
    --bg:#060708;--surface:#121417;--surface2:#17191D;--border:#26292E;--focus:#3E434A;
    --text:#E8E6E1;--text2:#8A8F98;--text3:#5A5F66;--accent:#E8A33D;
    --red:#E5484D;--amber:#E8A33D;--green:#30A46C;--blue:#3E63DD;--inv-bg:#E8E6E1;--inv-text:#0B0C0E;
    position:fixed;inset:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;
  }
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3)}
  .mono{font-family:'IBM Plex Mono',monospace}
  .title{font-family:'Space Grotesk',system-ui;font-weight:600;letter-spacing:.2px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;padding:5px 9px;border:1px solid var(--border);border-radius:2px;color:var(--text2);background:rgba(11,12,14,.72);cursor:pointer;backdrop-filter:blur(4px)}
  .pill.on{color:var(--text);border-color:var(--focus);background:rgba(23,25,29,.85)}
  .pill.amber{color:var(--amber);border-color:var(--amber)}
  .lg{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text2)}
  .lg .d{width:8px;height:8px;border-radius:50%;flex:none}
  .bk{position:absolute;width:14px;height:14px;border-color:var(--focus);border-style:solid;border-width:0;z-index:4;pointer-events:none}
  .hud{position:absolute;left:0;right:0;display:flex;align-items:center;gap:14px;padding:12px 22px;z-index:3;pointer-events:none}
  .hud > *{pointer-events:auto}
  .card{position:absolute;right:20px;top:64px;width:260px;background:rgba(18,20,23,.92);border:1px solid var(--border);border-radius:2px;padding:13px;z-index:4;backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:7px}
  input[type=range]{-webkit-appearance:none;width:110px;height:2px;background:var(--border);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--amber);cursor:pointer}
</style>
</helmet>

<div class="mf-root">
  <div class="bk" style="left:12px;top:12px;border-left-width:1px;border-top-width:1px"></div>
  <div class="bk" style="right:12px;top:12px;border-right-width:1px;border-top-width:1px"></div>
  <div class="bk" style="left:12px;bottom:12px;border-left-width:1px;border-bottom-width:1px"></div>
  <div class="bk" style="right:12px;bottom:12px;border-right-width:1px;border-bottom-width:1px"></div>

  <!-- top HUD -->
  <div class="hud" style="top:0">
    <a href="MapaGeral.dc.html" style="text-decoration:none"><span class="pill">← 2D</span></a>
    <div style="display:flex;flex-direction:column;gap:2px">
      <span class="eyebrow" style="color:var(--text2)">MAPA GERAL · 3D · AO VIVO</span>
      <span class="title" style="font-size:14px">{{ resumo }}</span>
    </div>
    <div style="flex:1"></div>
    <span class="lg"><span class="d" style="background:#E8E6E1"></span>projeto</span>
    <span class="lg"><span class="d" style="background:#3E63DD"></span>workflow</span>
    <span class="lg"><span class="d" style="background:#30A46C"></span>entidade de dados</span>
    <span class="lg"><span class="d" style="background:#E8A33D"></span>precisa de você</span>
    <span class="lg"><span class="d" style="background:#5A5F66"></span>ocioso</span>
  </div>

  <!-- 3D stage -->
  <div ref="{{ stageRef }}" style="position:absolute;inset:0"></div>

  <!-- node card -->
  <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
    <div class="card">
      <span class="eyebrow" style="color:var(--text3)">{{ sel.tipo }}</span>
      <span class="title" style="font-size:16px">{{ sel.nome }}</span>
      <span class="mono" style="font-size:10.5px;color:var(--text2);line-height:1.5">{{ sel.info }}</span>
      <span class="mono" style="font-size:10px;color:{{ sel.stColor }}">{{ sel.status }}</span>
      <span class="pill" onClick="{{ clearSel }}" style="align-self:flex-start;margin-top:4px">fechar</span>
    </div>
  </sc-if>

  <!-- bottom HUD -->
  <div class="hud" style="bottom:0">
    <span class="eyebrow">camada</span>
    <span class="{{ clsMacro }}" onClick="{{ setMacro }}">macro</span>
    <span class="{{ clsFull }}" onClick="{{ setFull }}">completo</span>
    <div style="width:1px;height:16px;background:var(--border)"></div>
    <span class="{{ clsPause }}" onClick="{{ togglePause }}">{{ pauseLabel }}</span>
    <span class="{{ clsFlow }}" onClick="{{ toggleFlow }}">⚡ fluxo</span>
    <div style="width:1px;height:16px;background:var(--border)"></div>
    <span class="eyebrow">arestas</span>
    <input type="range" min="0.05" max="0.6" step="0.05" value="{{ linkOp }}" onChange="{{ setLinkOp }}"/>
    <div style="flex:1"></div>
    <span class="mono" style="font-size:10px;color:var(--text2)">nós <b style="color:var(--text)">{{ nNodes }}</b> · arestas <b style="color:var(--text)">{{ nLinks }}</b> · fluxo só onde há run ativo</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;}}">
class Component extends DCLogic {
  state = { sel: null, paused: false, flow: true, layer: 'full', linkOp: 0.25 };

  data() {
    const N = (id, nome, tipo, info, status, stColor, group, val, hot) => ({ id, nome, tipo, info, status, stColor, group, val, hot });
    const nodes = [
      N('motor', 'motor', 'núcleo', 'orquestrador v0.5 · 3 runs ativos', 'executando', 'var(--blue)', 'core', 22, 'live'),
      // projetos
      N('p-logisti', 'Logisti-Kit', 'projeto', '2 runs ativos · US$ 0.52/dia', 'executando', 'var(--blue)', 'proj', 14, 'live'),
      N('p-pesquisa', 'Pesquisa', 'projeto', '1 run pausado no gate humano', 'precisa de você', 'var(--amber)', 'proj', 14, 'gate'),
      N('p-conteudo', 'Conteúdo', 'projeto', 'anuncio-3d concluído há 6h', 'ocioso', 'var(--text3)', 'proj', 12, ''),
      N('p-meta', 'Meta-fábrica', 'projeto', 'curador em análise contínua', 'observando', 'var(--text3)', 'proj', 12, ''),
      // workflows
      N('w-csv', 'csv → json v3', 'workflow', 'fan-out · 28 runs · 86% 1ª aprovação', 'executando', 'var(--blue)', 'wf', 7, 'live'),
      N('w-fatia', 'logisti-fatia v4', 'workflow', 'dependências · onda 2 de 3', 'executando', 'var(--blue)', 'wf', 7, 'live'),
      N('w-receita', 'pesquisa-receita v2', 'workflow', 'gate cobertura reprovou · escalado', 'pausado no gate', 'var(--amber)', 'wf', 7, 'gate'),
      N('w-anuncio', 'anuncio-3d v2', 'workflow', 'último digest aprovado', 'concluído', 'var(--green)', 'wf', 6, ''),
      N('w-spec', 'spec-writer v1', 'workflow', 'rascunho · não certificado', 'ocioso', 'var(--text3)', 'wf', 5, ''),
      // entidades de dados
      N('d-clientes', 'clientes.db', 'entidade · ponte', 'lida por 2 projetos — entidade-ponte', 'leitura ativa', 'var(--green)', 'data', 6, 'live'),
      N('d-receitas', 'receitas-benchmark', 'dataset · HF', 'rag.consultado · 6 chunks no run atual', 'consultado', 'var(--green)', 'data', 6, 'live'),
      N('d-catalogo', 'catalogo.db', 'entidade', 'escrita pelo csv→json', 'escrita ativa', 'var(--green)', 'data', 5, 'live'),
      N('d-notas', 'notas-md', 'entidade', 'notas do projeto meta', 'ocioso', 'var(--text3)', 'data', 4, ''),
    ];
    const L = (s, t, live) => ({ source: s, target: t, live: !!live });
    const links = [
      L('motor', 'p-logisti', 1), L('motor', 'p-pesquisa', 1), L('motor', 'p-conteudo'), L('motor', 'p-meta'),
      L('p-logisti', 'w-csv', 1), L('p-logisti', 'w-fatia', 1), L('p-pesquisa', 'w-receita', 1),
      L('p-conteudo', 'w-anuncio'), L('p-meta', 'w-spec'),
      L('w-csv', 'd-catalogo', 1), L('w-csv', 'd-clientes', 1), L('w-fatia', 'd-clientes', 1),
      L('w-receita', 'd-receitas', 1), L('p-meta', 'd-notas'), L('p-pesquisa', 'd-clientes'),
    ];
    return { nodes, links };
  }

  glowSprite(hex, size) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(64, 64, 4, 64, 64, 64);
    g.addColorStop(0, hex); g.addColorStop(0.25, hex + 'cc'); g.addColorStop(0.55, hex + '33'); g.addColorStop(1, hex + '00');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(c);
    const m = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    const s = new THREE.Sprite(m); s.scale.set(size, size, 1);
    return s;
  }

  colorOf(n) {
    if (n.hot === 'gate') return '#E8A33D';
    if (n.group === 'core') return '#3E63DD';
    if (n.group === 'proj') return '#E8E6E1';
    if (n.group === 'wf') return n.hot ? '#3E63DD' : '#5A5F66';
    return n.hot ? '#30A46C' : '#5A5F66';
  }

  stageRef = (el) => {
    if (!el || this._g || typeof ForceGraph3D === 'undefined') return;
    const full = this.data();
    this._g = ForceGraph3D()(el)
      .width(window.innerWidth).height(window.innerHeight)
      .backgroundColor('#060708')
      .showNavInfo(false)
      .nodeLabel(n => `<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.5px;color:#E8E6E1;background:rgba(11,12,14,.85);border:1px solid #3E434A;padding:3px 7px;border-radius:2px">${n.nome} · ${n.tipo}</div>`)
      .nodeThreeObject(n => {
        const grp = new THREE.Group();
        const col = this.colorOf(n);
        const core = new THREE.Mesh(
          new THREE.SphereGeometry(Math.cbrt(n.val) * 1.6, 24, 24),
          new THREE.MeshBasicMaterial({ color: col })
        );
        grp.add(core);
        grp.add(this.glowSprite(col, Math.cbrt(n.val) * (n.hot ? 22 : 10)));
        return grp;
      })
      .linkColor(l => l.live ? '#3E63DD' : '#26292E')
      .linkOpacity(this.state.linkOp)
      .linkWidth(l => l.live ? 0.6 : 0.25)
      .linkDirectionalParticles(l => l.live && this.state.flow ? 3 : 0)
      .linkDirectionalParticleSpeed(0.004)
      .linkDirectionalParticleWidth(1.4)
      .linkDirectionalParticleColor(() => '#E8A33D')
      .onNodeClick(n => this.setState({ sel: n.id }))
      .onBackgroundClick(() => this.setState({ sel: null }))
      .graphData(full);
    this._g.d3Force('charge').strength(-160);
    this._onResize = () => this._g.width(window.innerWidth).height(window.innerHeight);
    window.addEventListener('resize', this._onResize);
    this._full = full;
  };

  componentWillUnmount() {
    if (this._onResize) window.removeEventListener('resize', this._onResize);
    if (this._g) { this._g.pauseAnimation(); this._g = null; }
  }

  applyLayer(layer) {
    if (!this._g) return;
    if (layer === 'macro') {
      const keep = new Set(this._full.nodes.filter(n => n.group === 'core' || n.group === 'proj').map(n => n.id));
      this._g.graphData({
        nodes: this._full.nodes.filter(n => keep.has(n.id)),
        links: this._full.links.filter(l => keep.has(l.source.id ?? l.source) && keep.has(l.target.id ?? l.target)),
      });
    } else this._g.graphData(this._full);
  }

  renderVals() {
    const st = this.state;
    const full = this._full || this.data();
    const sel = st.sel ? full.nodes.find(n => n.id === st.sel) : null;
    return {
      stageRef: this.stageRef,
      resumo: '4 projetos · 5 workflows · 4 entidades de dados · 3 runs ativos',
      nNodes: st.layer === 'macro' ? 5 : full.nodes.length,
      nLinks: st.layer === 'macro' ? 4 : full.links.length,
      hasSel: !!sel,
      sel: sel || { nome: '', tipo: '', info: '', status: '', stColor: '' },
      clearSel: () => this.setState({ sel: null }),
      clsMacro: st.layer === 'macro' ? 'pill on' : 'pill',
      clsFull: st.layer === 'full' ? 'pill on' : 'pill',
      setMacro: () => { this.setState({ layer: 'macro' }); this.applyLayer('macro'); },
      setFull: () => { this.setState({ layer: 'full' }); this.applyLayer('full'); },
      clsPause: st.paused ? 'pill amber' : 'pill',
      pauseLabel: st.paused ? '▶ retomar' : '⏸ pausar física',
      togglePause: () => {
        const p = !st.paused; this.setState({ paused: p });
        if (this._g) p ? this._g.pauseAnimation() : this._g.resumeAnimation();
      },
      clsFlow: st.flow ? 'pill on' : 'pill',
      toggleFlow: () => {
        const f = !st.flow; this.setState({ flow: f });
        if (this._g) this._g.linkDirectionalParticles(l => l.live && f ? 3 : 0);
      },
      linkOp: st.linkOp,
      setLinkOp: (e) => {
        const v = parseFloat(e.target.value); this.setState({ linkOp: v });
        if (this._g) this._g.linkOpacity(v);
      },
    };
  }
}
</script>
</body>
</html>
